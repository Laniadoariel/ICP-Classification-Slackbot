[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icp-classification-slackbot"
version = "0.1.0"
description = "Slack bot + portal for ICP classification"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "slack-bolt>=1.20.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "beautifulsoup4>=4.12.3",
  "openai>=1.40.0",
  "tldextract>=5.1.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "backports.zoneinfo>=0.2.1; python_version < '3.9'",
  "tzdata>=2024.1; python_version < '3.9'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

